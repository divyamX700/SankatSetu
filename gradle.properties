org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 7.4.2's default per-artifact D8 dexing transform throws a bare
# NullPointerException on cedar-java-4.3.1.jar and its transitive
# error_prone_annotations-2.36.0.jar (both built with a newer toolchain than
# this old D8 expects) — the same class of AGP-7.4.2-D8-vs-newer-bytecode
# bug ADR 0006 already documents for CameraX/lifecycle. Disabling the
# per-artifact transform falls back to whole-classpath dexing, which does
# not hit this specific crash. See docs/adr/0017-cedar-cross-compile.md.
android.enableDexingArtifactTransform=false

# NOTE: this build was verified on a machine that required org.gradle.java.home
# pinned to a JDK 11 install (see docs/adr/0006-jdk11-toolchain-downgrade.md
# for why). That path is machine-specific, so it is NOT set here — set it in
# your own ~/.gradle/gradle.properties (or GRADLE_HOME/JAVA_HOME) instead if
# you hit the same "Unable to establish loopback connection" error, rather
# than committing a personal path into the shared project config.
